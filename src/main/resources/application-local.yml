spring:
  datasource:
    url: jdbc:mysql://localhost:3306/esports_platform?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET:esports-platform-dev}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-override-in-env-file-32-bytes-min}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

toss:
  secret-key: ${TOSS_SECRET_KEY:}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}

logging:
  level:
    com.esports.platform: debug
